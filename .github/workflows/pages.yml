# Build the portal and publish it to GitHub Pages on every push to main.
# The book data (catalog.json) lives here; the generator and page template
# come from the platform repository at the moving v1 tag.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out platform (v1)
        uses: actions/checkout@v7
        with:
          repository: AwesomeTechBooks/platform
          ref: v1
          path: platform
      - name: Check that README.md is up to date
        run: python3 platform/tools/build-portal.py catalog.json --readme README.md --check
      - name: Build portal
        run: python3 platform/tools/build-portal.py catalog.json --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
